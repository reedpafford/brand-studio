[project]
name = "brand-studio-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "uvicorn>=0.54",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "httpx2>=2.13",
    "pypdf>=6.21.2",
    "defusedxml>=0.7.1",
    "anthropic>=2.2.0",
    "pillow>=13.0.0",
    "mutagen>=1.48.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]
# Reel import in the worker image only (tests use stand-ins): yt-dlp and faster-whisper.
reel = ["yt-dlp==2026.8.19", "faster-whisper==1.2.1", "av<19"]  # av 19 breaks faster-whisper 1.2.1

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["whisper: runs the real speech model (needs the reel group; downloads ~460 MB)"]
addopts = "-m 'not whisper'"
