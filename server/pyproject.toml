[project]
name = "brand-studio-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "uvicorn>=0.54",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "httpx2>=2.13",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
