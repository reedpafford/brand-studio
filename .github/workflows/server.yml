name: server
on:
  pull_request:
  workflow_call:  # on main, deploy.yml runs this before deploying
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install ffmpeg (for stitching the final video; retries once if the mirror stalls)
        timeout-minutes: 8
        run: |
          timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg \
            || { sudo apt-get update -qq && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg; }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
