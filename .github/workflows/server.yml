name: server
on:
  pull_request:
  workflow_call:  # on main, deploy.yml runs this before deploying
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install ffmpeg (stitching the final video)
        uses: ./.github/actions/ffmpeg
        timeout-minutes: 16
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
