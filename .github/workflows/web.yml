name: web
on:
  pull_request:
  workflow_call:  # on main, deploy.yml runs this before deploying
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: A pull request that only adds to the spend log skips the rest (nothing here can change)
        id: spend
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if [ "$files" = "ops/SPEND.md" ]; then echo "only=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.spend.outputs.only != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.spend.outputs.only != 'true'
      - run: npm run lint
        if: steps.spend.outputs.only != 'true'
      - run: npm run typecheck
        if: steps.spend.outputs.only != 'true'
      - run: npm test
        if: steps.spend.outputs.only != 'true'
      - run: npx vite build
        if: steps.spend.outputs.only != 'true'
