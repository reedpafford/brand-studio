name: deploy-next
# Every push to `next`: run all checks, then update the test site (Brand Studio Next) on the same
# server as live, over SSH (deploy/next/remote-deploy.sh). Uses the live deploy's repo secrets
# (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_HOST_KEY). The test site runs on the free stand-ins:
# only for a paid test Reed and the Producer approved, set repo variable NEXT_FAKE_PROVIDERS to
# false (and NEXT_GENERATION_ENABLED to true), run this, and set it back afterwards.
# Real Suno songs through KIE (Reed, 2026-10-29: test site only, with a test budget): set repo
# variable NEXT_KIE_SUNO to true and NEXT_KIE_BUDGET_USD to the budget, with the KIE_API_KEY
# secret. Everything else stays on the stand-ins.
# Real look samples (Reed, 2026-10-29: test site only, with a test budget): set repo variable
# NEXT_REAL_LOOK_SAMPLES to true and NEXT_LOOK_SAMPLES_BUDGET_USD to the budget; they use the
# REPLICATE_API_TOKEN secret. Only a look's sample (still and 5 s clip) goes real.
on:
  push:
    branches: [next]
    paths:
      - "**"
      - "!ops/**"
      - "!docs/**"
      - "docs/references/**"
      - "!*.md"
  workflow_dispatch:
concurrency:
  group: deploy-next  # never queued behind or cancelling a live deploy
  cancel-in-progress: false
jobs:
  server:
    uses: ./.github/workflows/server.yml
  web:
    uses: ./.github/workflows/web.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  caddy:
    uses: ./.github/workflows/caddy.yml
  next:
    needs: [server, web, e2e, caddy]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - name: Check the server secrets are set
        id: secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST_KEY" ]; then
            echo "::warning::Not deployed: the live deploy's server secrets are missing (deploy/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          case "$VPS_HOST_KEY" in
            ssh-*|ecdsa-*) printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts ;;
            *) printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts ;;
          esac
      - name: Deploy the test site and wait for its /api/health
        if: steps.secrets.outputs.ready == 'true'
        env:
          FAKE: ${{ vars.NEXT_FAKE_PROVIDERS || 'true' }}
          GENERATION: ${{ vars.NEXT_GENERATION_ENABLED || 'false' }}
          # Keys travel only when the stand-ins are switched off for an approved paid test.
          REPLICATE: ${{ (vars.NEXT_FAKE_PROVIDERS == 'false' || vars.NEXT_REAL_LOOK_SAMPLES == 'true') && secrets.REPLICATE_API_TOKEN || '' }}
          ANTHROPIC: ${{ vars.NEXT_FAKE_PROVIDERS == 'false' && secrets.STUDIO_ANTHROPIC_KEY || '' }}
          # Real songs: the key travels only while NEXT_KIE_SUNO is true.
          KIE: ${{ vars.NEXT_KIE_SUNO == 'true' && secrets.KIE_API_KEY || '' }}
          KIE_BUDGET: ${{ vars.NEXT_KIE_BUDGET_USD || '0' }}
          KIE_HOSTS: ${{ vars.NEXT_KIE_DELIVERY_HOSTS || '' }}
          # Real look samples: the Replicate key travels only while this is true.
          LOOK_SAMPLES: ${{ vars.NEXT_REAL_LOOK_SAMPLES || 'false' }}
          LOOK_BUDGET: ${{ vars.NEXT_LOOK_SAMPLES_BUDGET_USD || '0' }}
        run: |
          {
            for name in FAKE GENERATION REPLICATE ANTHROPIC KIE KIE_BUDGET KIE_HOSTS LOOK_SAMPLES LOOK_BUDGET; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat deploy/next/remote-deploy.sh
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" bash -s
