name: deploy-next
# Every push to `next`: run all checks, then update the test site (Brand Studio Next) on the same
# server as live, over SSH (deploy/next/remote-deploy.sh). Uses the live deploy's repo secrets
# (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_HOST_KEY). The test site runs on the free stand-ins:
# only for a paid test Reed and the Producer approved, set repo variable NEXT_FAKE_PROVIDERS to
# false (and NEXT_GENERATION_ENABLED to true), run this, and set it back afterwards. Every real
# call then counts against NEXT_REAL_BUDGET_USD from NEXT_REAL_BUDGET_SINCE (an ISO time); set
# both together; with either unset, nothing paid runs.
# Real Suno songs through KIE (Reed, 2026-10-29: test site only, with a test budget): set repo
# variable NEXT_KIE_SUNO to true and NEXT_KIE_BUDGET_USD to the budget, with the KIE_API_KEY
# secret. Everything else stays on the stand-ins.
# Real look samples (Reed, 2026-10-29: test site only, with a test budget): set repo variable
# NEXT_REAL_LOOK_SAMPLES to true and NEXT_LOOK_SAMPLES_BUDGET_USD to the budget; they use the
# REPLICATE_API_TOKEN secret. Only a look's sample (still and 5 s clip) goes real.
# Real language tests (Reed, 2026-10-29: test site only, with a test budget): set repo variable
# NEXT_REAL_LANGUAGE_SAMPLES to true and NEXT_LANGUAGE_SAMPLES_BUDGET_USD to the budget; they use
# the STUDIO_ANTHROPIC_KEY secret. Only a language's sample script is written for real.
# With the stand-ins off, each other paid path stays off until its repo variable is true, and
# every call it makes counts against NEXT_REAL_BUDGET_USD: NEXT_ITEM_CHECKS_PAID (the take
# check on stills and takes: eyes, screens, cast, which self-approval, best take and the
# director's redos read), NEXT_NARRATION_MUSIC_PAID with NEXT_NARRATION_MUSIC_BUDGET_USD (a
# narration's music bed), and NEXT_SITE_READ_REAL (Import from website reads the real site).
# NEXT_ITEM_CHECK_SCOPE (key_takes, all_takes or everything; default key_takes) sets which
# items the take check looks at. All default off.
on:
  push:
    branches: [next]
    paths:
      - "**"
      - "!ops/**"
      - "!docs/**"
      - "docs/references/**"
      - "!*.md"
  workflow_dispatch:
concurrency:
  group: deploy-next  # never queued behind or cancelling a live deploy
  cancel-in-progress: false
jobs:
  server:
    uses: ./.github/workflows/server.yml
  web:
    uses: ./.github/workflows/web.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  caddy:
    uses: ./.github/workflows/caddy.yml
  next:
    needs: [server, web, e2e, caddy]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - name: Check the server secrets are set
        id: secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST_KEY" ]; then
            echo "::warning::Not deployed: the live deploy's server secrets are missing (deploy/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          case "$VPS_HOST_KEY" in
            ssh-*|ecdsa-*) printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts ;;
            *) printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts ;;
          esac
      - name: Deploy the test site and wait for its /api/health
        if: steps.secrets.outputs.ready == 'true'
        env:
          FAKE: ${{ vars.NEXT_FAKE_PROVIDERS || 'true' }}
          GENERATION: ${{ vars.NEXT_GENERATION_ENABLED || 'false' }}
          # Keys travel only when the stand-ins are switched off for an approved paid test.
          REPLICATE: ${{ (vars.NEXT_FAKE_PROVIDERS == 'false' || vars.NEXT_REAL_LOOK_SAMPLES == 'true') && secrets.REPLICATE_API_TOKEN || '' }}
          ANTHROPIC: ${{ (vars.NEXT_FAKE_PROVIDERS == 'false' || vars.NEXT_REAL_LANGUAGE_SAMPLES == 'true') && secrets.STUDIO_ANTHROPIC_KEY || '' }}
          # HeyGen (UGC talkers): the key travels only when the stand-ins are switched off.
          HEYGEN: ${{ vars.NEXT_FAKE_PROVIDERS == 'false' && secrets.HEYGEN_API_KEY || '' }}
          # Real songs: the key travels only while NEXT_KIE_SUNO is true.
          KIE: ${{ vars.NEXT_KIE_SUNO == 'true' && secrets.KIE_API_KEY || '' }}
          KIE_BUDGET: ${{ vars.NEXT_KIE_BUDGET_USD || '0' }}
          KIE_HOSTS: ${{ vars.NEXT_KIE_DELIVERY_HOSTS || '' }}
          # Real look samples: the Replicate key travels only while this is true.
          LOOK_SAMPLES: ${{ vars.NEXT_REAL_LOOK_SAMPLES || 'false' }}
          LOOK_BUDGET: ${{ vars.NEXT_LOOK_SAMPLES_BUDGET_USD || '0' }}
          # Real language tests: the Claude key travels only while this is true.
          LANGUAGE_TESTS: ${{ vars.NEXT_REAL_LANGUAGE_SAMPLES || 'false' }}
          LANGUAGE_BUDGET: ${{ vars.NEXT_LANGUAGE_SAMPLES_BUDGET_USD || '0' }}
          # Real AI (stand-ins off): one budget for every paid call, from its start time.
          REAL_BUDGET: ${{ vars.NEXT_REAL_BUDGET_USD || '0' }}
          REAL_SINCE: ${{ vars.NEXT_REAL_BUDGET_SINCE || '' }}
          # Paid paths, each off until a real test is approved (they count against the budget).
          ITEM_CHECKS_PAID: ${{ vars.NEXT_ITEM_CHECKS_PAID || 'false' }}
          ITEM_CHECK_SCOPE: ${{ vars.NEXT_ITEM_CHECK_SCOPE || 'key_takes' }}
          NARRATION_MUSIC_PAID: ${{ vars.NEXT_NARRATION_MUSIC_PAID || 'false' }}
          NARRATION_MUSIC_BUDGET: ${{ vars.NEXT_NARRATION_MUSIC_BUDGET_USD || '0' }}
          SITE_READ_REAL: ${{ vars.NEXT_SITE_READ_REAL || 'false' }}
          # Reed, 6 Nov: the owner's own work has no money holds; prices are estimates, spend is
          # the providers' own. Editors are held as before. Off unless this repo variable is true.
          OWNER_UNCAPPED: ${{ vars.NEXT_OWNER_UNCAPPED || 'false' }}
        run: |
          {
            for name in FAKE GENERATION REPLICATE ANTHROPIC HEYGEN KIE KIE_BUDGET KIE_HOSTS LOOK_SAMPLES LOOK_BUDGET LANGUAGE_TESTS LANGUAGE_BUDGET REAL_BUDGET REAL_SINCE ITEM_CHECKS_PAID ITEM_CHECK_SCOPE NARRATION_MUSIC_PAID NARRATION_MUSIC_BUDGET SITE_READ_REAL OWNER_UNCAPPED; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat deploy/next/remote-deploy.sh
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" bash -s
