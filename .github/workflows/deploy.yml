name: deploy
# Every push to main: run all checks, then update the live server over SSH (deploy/remote-deploy.sh).
# Repo secrets (deploy/README.md): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_HOST_KEY; optional DOMAIN,
# BS_SETUP_TOKEN, REPLICATE_API_TOKEN, STUDIO_ANTHROPIC_KEY. Repo variable BS_GENERATION_ENABLED.
on:
  push:
    branches: [main]
    # Notes only (ops/, docs/ but its references, root .md files): nothing to deploy, and a
    # deploy restarts the worker. Later lines win. Prompt .md files (server/app/prompts/*.md)
    # are app code and docs/references is copied into the server image: both always deploy.
    paths:
      - "**"
      - "!ops/**"
      - "!docs/**"
      - "docs/references/**"
      - "!*.md"
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  server:
    uses: ./.github/workflows/server.yml
  web:
    uses: ./.github/workflows/web.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  caddy:
    uses: ./.github/workflows/caddy.yml
  live:
    needs: [server, web, e2e, caddy]
    runs-on: ubuntu-latest
    timeout-minutes: 40  # the first deploy builds everything (~15 min)
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - name: Check the server secrets are set
        id: secrets
        run: |
          # VPS_HOST_KEY pins the server's identity, so keys are never sent to an impostor.
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST_KEY" ]; then
            echo "::warning::Not deployed: add VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_HOST_KEY repo secrets (deploy/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          # The key may be pasted as-is or as one base64 line (easier to copy on a phone).
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          # The server's public host key ("ssh-ed25519 AAAA..."), or full known_hosts lines.
          case "$VPS_HOST_KEY" in
            ssh-*|ecdsa-*) printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts ;;
            *) printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts ;;
          esac
      - name: Deploy and wait for /api/health
        if: steps.secrets.outputs.ready == 'true'
        env:
          SETUP_TOKEN: ${{ secrets.BS_SETUP_TOKEN }}
          REPLICATE: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC: ${{ secrets.STUDIO_ANTHROPIC_KEY }}
          DOMAIN_OVERRIDE: ${{ secrets.DOMAIN }}
          GENERATION: ${{ vars.BS_GENERATION_ENABLED || 'false' }}
        run: |
          # Settings travel inside the SSH session (never as command-line arguments or files).
          {
            for name in SETUP_TOKEN REPLICATE ANTHROPIC DOMAIN_OVERRIDE GENERATION; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat deploy/remote-deploy.sh
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" bash -s
