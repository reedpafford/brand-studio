name: e2e
on:
  pull_request:
  workflow_call:  # on main, deploy.yml runs this before deploying
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: A pull request that only adds to the spend log skips the rest (nothing here can change)
        id: spend
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if [ "$files" = "ops/SPEND.md" ]; then echo "only=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.spend.outputs.only != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        if: steps.spend.outputs.only != 'true'
        with:
          python-version: "3.13"
      - name: Install ffmpeg (the stand-in videos)
        if: steps.spend.outputs.only != 'true'
        uses: ./.github/actions/ffmpeg
        timeout-minutes: 16
      - run: uv sync --locked
        if: steps.spend.outputs.only != 'true'
        working-directory: server
      - run: npm ci
        if: steps.spend.outputs.only != 'true'
      - name: API types match the server
        if: steps.spend.outputs.only != 'true'
        run: npm run api && git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
        if: steps.spend.outputs.only != 'true'
      - run: npm run e2e
        if: steps.spend.outputs.only != 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
