name: e2e
on:
  pull_request:
  workflow_call:  # on main, deploy.yml runs this before deploying
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install ffmpeg (for the stand-in videos; retries once if the mirror stalls)
        timeout-minutes: 8
        run: |
          timeout 180 sudo apt-get install -y --no-install-recommends ffmpeg \
            || { sudo dpkg --configure -a; sudo apt-get update -qq && timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg; }
      - run: uv sync --locked
        working-directory: server
      - run: npm ci
      - name: API types match the server
        run: npm run api && git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
