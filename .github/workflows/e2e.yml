name: e2e
on:
  pull_request:
  push:
    branches: [main]
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y --no-install-recommends ffmpeg  # the stand-in videos
      - run: uv sync --locked
        working-directory: server
      - run: npm ci
      - name: API types match the server
        run: npm run api && git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
