<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Studio tokens</title>
<link rel="stylesheet" href="../../web/src/styles/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 var(--text-base)/var(--leading-normal) var(--font-sans); }
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .theme { background: var(--bg); color: var(--text); padding: var(--space-5) var(--space-4); }
  .bar { display: flex; align-items: center; gap: var(--space-2); height: var(--topbar-h); padding: 0 var(--space-4);
         background: var(--surface); border-bottom: 3px solid var(--brand); margin: calc(-1 * var(--space-5)) calc(-1 * var(--space-4)) var(--space-5); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  h1 { font-size: var(--text-lg); font-weight: 600; margin: 0 0 var(--space-4); }
  h2 { font-size: var(--text-md); font-weight: 600; margin: 0 0 var(--space-3); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
  .muted { color: var(--text-muted); font-size: var(--text-sm); }
  button { font: 500 var(--text-base) var(--font-sans); height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:hover { background: var(--accent-hover); }
  .secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .ghost { background: transparent; color: var(--text); }
  .danger { background: var(--danger); color: var(--surface); }
  .full { width: 100%; height: 44px; }
  .chip, .badge { font-size: var(--text-xs); font-weight: 500; padding: 2px var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .chip.on { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
  .b-ok { background: var(--success-soft); color: var(--success); border: 0; }
  .b-warn { background: var(--warning-soft); color: var(--warning); border: 0; }
  .b-bad { background: var(--danger-soft); color: var(--danger); border: 0; }
  .b-acc { background: var(--accent-soft); color: var(--accent-text); border: 0; }
  label { display: flex; justify-content: space-between; font-weight: 500; margin-bottom: var(--space-1); }
  input { width: 100%; font: inherit; height: 36px; padding: 0 var(--space-3); color: var(--text); background: var(--surface);
          border: 1px solid var(--border-strong); border-radius: var(--radius-sm); }
  input::placeholder { color: var(--text-muted); }
  .meter { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
  .track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--accent); }
  .script { font: var(--text-base)/var(--leading-script) var(--font-script); background: var(--surface); }
  .add { background: var(--mark); border-bottom: 2px solid var(--mark-line); }
  .sheet { background: var(--surface-2); border-radius: var(--radius-sm); padding: var(--space-3); }
</style>
</head>
<body>
<div class="themes">
<section class="theme" data-theme="light"></section>
<section class="theme" data-theme="dark"></section>
</div>
<template id="t">
  <div class="bar"><span class="dot"></span><b>fomo</b><span class="muted">▾</span></div>
  <h1>Quick clip</h1>
  <div class="card">
    <h2>Buttons</h2>
    <div class="row"><button class="primary">Generate · 34 credits</button><button class="secondary">Reuse</button><button class="ghost">Cancel</button><button class="danger">Delete</button></div>
    <button class="primary full">Generate · 68 credits</button>
    <p class="muted" style="text-align:center;margin:var(--space-1) 0 0">Describe the clip (8+ characters)</p>
  </div>
  <div class="card">
    <h2>Fields and chips</h2>
    <label>Prompt <span class="muted">0 / 2,000</span></label>
    <input placeholder="Who's in it, what happens, how the camera moves">
    <div class="row" style="margin-top:var(--space-3)"><span class="chip on">9:16</span><span class="chip">1:1</span><span class="chip">16:9</span></div>
    <div class="row"><span class="badge b-acc">Rendering 42%</span><span class="badge b-ok">Ready</span><span class="badge b-warn">Almost at budget</span><span class="badge b-bad">Failed · credits returned</span></div>
  </div>
  <div class="card">
    <h2>Credits meter</h2>
    <div class="meter"><span class="track"><i style="width:62%"></i></span>412 / 660 credits · 62%</div>
  </div>
  <div class="card script">
    SCENE 1 — INT. KITCHEN — MORNING<br>
    Mia scrolls her phone, coffee in hand.<br>
    &nbsp;&nbsp;<span class="add">▸ Slow push-in on her face as she reads.</span><br>
    MIA: Wait… it dipped?<br>
    She sighs and puts the cup down.
  </div>
  <div class="sheet muted">Surface-2 · used for sunken areas, skeletons and empty thumbnails.</div>
</template>
<script>
  for (const s of document.querySelectorAll('.theme')) s.append(document.getElementById('t').content.cloneNode(true));
</script>
</body>
</html>
