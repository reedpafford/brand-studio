# Brand Studio on one server. Run from this folder: docker compose up -d --build
# Settings and keys live in deploy/.env (copy .env.example). Never commit .env.
name: brand-studio

x-server: &server
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
  image: brand-studio-server
  restart: unless-stopped
  env_file: .env
  environment: &server-env
    BS_ENV: production
    BS_DATABASE_URL: postgresql+psycopg://brand:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/brand
    BS_STORAGE_DIR: /data/storage
    BS_COOKIE_SECURE: "true"
    # Provider keys go to the worker only (the only part that calls Replicate or Claude).
    REPLICATE_API_TOKEN: ""
    STUDIO_ANTHROPIC_KEY: ""
  volumes:
    - files:/data/storage

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brand
      POSTGRES_DB: brand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brand", "-d", "brand"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once per deploy: brings the database up to date, then exits.
  migrate:
    <<: *server
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *server
    # No published port: only Caddy can reach it, so trusting its forwarded headers is safe.
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Stills and takes: handed to Replicate and checked on, so they never wait behind a long
  # Claude call (Reed's 9 stills waited 6 minutes behind three breakdowns, 2026-10-28).
  worker:
    <<: *server
    command: ["python", "-m", "app.worker"]
    # A deploy waits for the job in hand instead of cutting it off.
    stop_grace_period: 10m
    environment:
      <<: *server-env
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      BS_WORKER_PROVIDERS: '["fake", "replicate"]'  # Claude and reel prep have their own
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Claude answers in the same call (a breakdown or clip prompts can take minutes), one at a time.
  claude-worker:
    <<: *server
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 10m  # a deploy lets the Claude call in hand finish
    environment:
      <<: *server-env
      STUDIO_ANTHROPIC_KEY: ${STUDIO_ANTHROPIC_KEY:-}
      BS_WORKER_PROVIDERS: '["claude"]'
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Free reel prep (fetch, cuts, transcription) is slow, so it never holds up the paid queue.
  reel-worker:
    <<: *server
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *server-env
      BS_WORKER_PROVIDERS: '["local"]'
      HF_HOME: /data/models  # the speech model, downloaded once at start
    volumes:
      - files:/data/storage
      - models:/data/models
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: brand-studio-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8443:8443"  # the test site (deploy/next/README.md)
    networks: [default, edge]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: brand-studio-edge
    external: true  # made by deploy/remote-deploy.sh; the test site's web server joins it

volumes:
  db:
  files:
  models:
  caddy_data:
  caddy_config:
